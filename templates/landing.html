{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITtrack | Bienvenido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/landing.css' %}">
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="logo-mark">FT</div>
      <div>
        <h1>FITtrack</h1>
        <p class="subtitle">Tu hub para rutinas, comidas y progreso.</p>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Inicia sesión</h2>
        <p>Vuelve a tus planes, rutinas y favoritos.</p>
        <a class="btn btn-primary" href="/login/">Iniciar sesión</a>
      </section>
      <section class="card">
        <h2>Regístrate</h2>
        <p>Crea tu cuenta para guardar tu progreso y comidas.</p>
        <a class="btn btn-secondary" href="/register/">Crear cuenta</a>
      </section>
    </div>
  </main>
</body>
</html>
